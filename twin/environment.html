<script>
// =========================================
//  Data loading + state
// =========================================
const STATE = {
  data: null,
  range: '30d',
  charts: {},
  current: { sst:0, sg:0, n:0, p:0, t:null },
  prev:    { sst:0, sg:0, n:0, p:0 },
};

const KEYS = ['sst', 'sg', 'n', 'p'];
const FMT = {
  sst: v => v.toFixed(2),
  sg:  v => v.toFixed(4),
  n:   v => v.toFixed(1),
  p:   v => v.toFixed(2),
};
const UNITS = { sst: '°C', sg: '', n: 'ppm', p: 'ppm' };
const FLAT_EPS = { sst: 0.005, sg: 0.00005, n: 0.05, p: 0.005 }; // 變化小於此值顯示「持平」
// 圖上的警戒虛線：水溫白化、氮磷優養化
const THRESHOLDS = {
  sst: { v: 29.0, label: '白化警戒 · 29 °C' },
  n:   { v: 10,   label: '警戒 · 10 ppm' },
  p:   { v: 0.20, label: '警戒 · 0.20 ppm' },
};

// =========================================
//  Time-series slicing
// =========================================
function getSeries(range) {
  const d = STATE.data;
  if (range === '24h') return d.history_24h;
  if (range === '7d')  return d.history_30d.slice(-24*7 - 1);
  return d.history_30d;
}

// =========================================
//  Chart factory
// =========================================
function pointBgFor(key, val) {
  if (key === 'sst' && val >= 28.5) return '#f87171';
  return 'transparent';
}
function pointRadiusFor(key, val) {
  if (key === 'sst' && val >= 28.5) return 3;
  return 0;
}

function buildChart(canvasId, key, color, axis) {
  const ctx = document.getElementById(canvasId).getContext('2d');
  return new Chart(ctx, {
    type: 'line',
    data: { datasets: [{
      label: key.toUpperCase(),
      data: [],
      borderColor: color,
      borderWidth: 1.4,
      tension: 0.25,
      pointRadius: 0,
      pointHoverRadius: 4,
      pointBackgroundColor: ctx2 => {
        const i = ctx2.dataIndex; const p = ctx2.dataset.data[i];
        return p ? pointBgFor(key, p.y) : 'transparent';
      },
      pointRadiusCallback: undefined,
      fill: { target: 'origin', above: hexToRgba(color, 0.06) },
    }]},
    options: {
      responsive: true, maintainAspectRatio: false, animation: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: '#ffffff', borderColor: '#e2e8f0', borderWidth: 1,
          titleColor: '#1e293b', bodyColor: '#475569', padding: 8,
          displayColors: false,
          callbacks: {
            title: items => new Date(items[0].parsed.x).toLocaleString(),
            label: ctx2 => ` ${FMT[key](ctx2.parsed.y)} ${UNITS[key]}`.trimEnd(),
          }
        },
      },
      scales: {
        x: { type: 'time',
             time: { displayFormats: { hour: 'MM/dd HH:mm', day: 'MM/dd', minute: 'HH:mm' } },
             ticks: { color: '#94a3b8', maxRotation: 0, autoSkipPadding: 18, font: { size: 10 } },
             grid:  { color: 'rgba(226,232,240,.6)', drawBorder: false } },
        y: { ticks: { color: '#94a3b8', font: { size: 10 } },
             grid: { color: 'rgba(226,232,240,.6)', drawBorder: false },
             suggestedMin: axis.min, suggestedMax: axis.max },
      },
    },
    plugins: THRESHOLDS[key] ? [thresholdLinePlugin(THRESHOLDS[key])] : [],
  });
}

const thresholdLinePlugin = (th) => ({
  id: 'thresholdLine',
  afterDatasetsDraw(chart) {
    const yScale = chart.scales.y; const xScale = chart.scales.x;
    const y = yScale.getPixelForValue(th.v);
    if (!isFinite(y) || y < chart.chartArea.top || y > chart.chartArea.bottom) return; // 警戒值不在圖表範圍內就不畫
    const ctx = chart.ctx;
    ctx.save();
    ctx.strokeStyle = '#f87171'; ctx.lineWidth = 1; ctx.setLineDash([4,4]);
    ctx.beginPath(); ctx.moveTo(xScale.left, y); ctx.lineTo(xScale.right, y); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = '#ef4444'; ctx.font = '10px Inter, sans-serif';
    ctx.fillText(th.label, xScale.left + 6, y - 4);
    ctx.restore();
  }
});

function hexToRgba(hex, a) {
  const h = hex.replace('#',''); const n = parseInt(h, 16);
  const r = (n>>16)&255, g=(n>>8)&255, b=n&255;
  return `rgba(${r},${g},${b},${a})`;
}

// =========================================
//  Render
// =========================================
function setReading(key, val) {
  const prev = STATE.prev[key];
  STATE.prev[key] = STATE.current[key];
  STATE.current[key] = val;
  document.getElementById('r-'+key).textContent = FMT[key](val);
  const d = document.getElementById('d-'+key);
  const delta = val - prev;
  if (Math.abs(delta) < FLAT_EPS[key]) { d.className='trend-flat text-[12px] ml-auto tabular-nums'; d.textContent='→ ±'+FMT[key](0); }
  else if (delta > 0) { d.className='trend-up text-[12px] ml-auto tabular-nums'; d.textContent='▲ +'+FMT[key](Math.abs(delta)); }
  else                { d.className='trend-down text-[12px] ml-auto tabular-nums'; d.textContent='▼ -'+FMT[key](Math.abs(delta)); }
}

function refreshCharts() {
  const s = getSeries(STATE.range);
  const make = key => s.map(p => ({ x: new Date(p.t).getTime(), y: p[key] }));
  KEYS.forEach(k => { STATE.charts[k].data.datasets[0].data = make(k); });
  const sstData = STATE.charts.sst.data.datasets[0].data;
  STATE.charts.sst.data.datasets[0].pointRadius = sstData.map(p => p.y >= 28.5 ? 3 : 0);
  Object.values(STATE.charts).forEach(c => c.update('none'));
  const label = STATE.range === '24h' ? '近 24 小時' : STATE.range === '7d' ? '近 7 天' : '近 30 天';
  KEYS.forEach(k => document.getElementById('range-label-'+k).textContent = label);
  refreshAtoChart();
}

function setRange(r) {
  STATE.range = r;
  document.querySelectorAll('.seg-btn').forEach(b => b.classList.toggle('active', b.dataset.range === r));
  refreshCharts();
}

// =========================================
//  Live update simulation: every 30s ±0.1
// =========================================
function jitter(amp) { return (Math.random()*2 - 1) * amp; }


// ── 水位（自動補水器）與燈光排程 ──
const ATO_ZONES = { high: '偏高', ok: '正常', low: '偏低' };
// 依當下時間在排程節點間線性內插（22 點之後接回 0 點）
function lightAt(light, ch, hour) {
  const hs = light.hours, vs = ch.values;
  for (let i = 0; i < hs.length; i++) {
    const h0 = hs[i], h1 = i + 1 < hs.length ? hs[i + 1] : 24;
    if (hour >= h0 && hour <= h1) return vs[i] + (vs[(i + 1) % vs.length] - vs[i]) * (hour - h0) / (h1 - h0);
  }
  return 0;
}
// 下一次開始漸亮的時間（節點值為 0、下一個節點 > 0）
function lightRampStart(light) {
  const ch = light.channels[0];
  const i = ch.values.findIndex((v, k) => v === 0 && ch.values[(k + 1) % ch.values.length] > 0);
  return i < 0 ? null : light.hours[i];
}
function nowHour() { const d = new Date(); return d.getHours() + d.getMinutes() / 60; }
const pad2 = (n) => String(n).padStart(2, '0');

// 水位示意（線條扁平風）：開口魚缸剖面，水面線條流動、氣泡上升；右側刻度標出正常範圍與目前水位
const ATO_LEVEL = { high: 86, ok: 62, low: 34 };   // 各區段畫在缸內的水位高度（%）
const ATO_BAND = [48, 76];                          // 正常範圍（%）
function renderAto(ato) {
  const z = ato.zone in ATO_ZONES ? ato.zone : 'ok';
  const T = { x: 34, y: 16, w: 110, h: 136, sand: 6 };   // sand：0% 水位離缸底的邊距
  const R = T.x + T.w;                                      // 缸右緣；指標、刻度都相對它擺
  const bottom = T.y + T.h, sandY = bottom - T.sand;
  const yOf = (pct) => sandY - (sandY - T.y) * pct / 100;
  const level = yOf(ATO_LEVEL[z]), bandTop = yOf(ATO_BAND[1]), bandBot = yOf(ATO_BAND[0]);
  // 兩個週期以上的正弦線，往左平移一個週期（48px）即可無縫循環
  const waveLine = (amp, phase) => {
    let d = '';
    for (let x = T.x - 60; x <= T.x + T.w + 60; x += 4) d += `${d ? ' L' : 'M'}${x} ${(level + amp * Math.sin((x / 48) * 2 * Math.PI + phase)).toFixed(2)}`;
    return d;
  };
  const front = waveLine(2.4, 0);
  const bubbles = [[0.24, 0, 4.2, 2.4], [0.47, 1.4, 5.0, 1.8], [0.67, 2.6, 4.6, 2.8], [0.84, 0.8, 5.6, 2]]
    .map(([f, delay, dur, r]) => `<circle class="tank-bubble" cx="${(T.x + f * T.w).toFixed(1)}" cy="${sandY - 6}" r="${r}" style="--rise:${(level + 8 - (sandY - 6)).toFixed(0)}px;--dur:${dur}s;animation-delay:${delay}s"/>`).join('');
  const ticks = Array.from({ length: 11 }, (_, i) => {
    const y = yOf(i * 10), major = i % 5 === 0;
    return `<line x1="${R + (major ? 20 : 23)}" y1="${y}" x2="${R + 28}" y2="${y}"/>`;
  }).join('');
  const L = 'fill="none" stroke-linecap="round" stroke-linejoin="round"';
  document.getElementById('ato-svg').innerHTML = `
    <defs><clipPath id="tank-clip"><path d="M${T.x} ${T.y} V${bottom - 12} Q${T.x} ${bottom} ${T.x + 12} ${bottom} H${T.x + T.w - 12} Q${T.x + T.w} ${bottom} ${T.x + T.w} ${bottom - 12} V${T.y} Z"/></clipPath></defs>
    <g clip-path="url(#tank-clip)">
      <g class="tank-wave-front"><path d="${front} V${bottom + 4} H${T.x - 60} Z" fill="#e0f2fe"/></g>
      <path class="tank-wave-back" d="${waveLine(3, 1.6)}" ${L} stroke="#7dd3fc" stroke-width="1.5"/>
      <path class="tank-wave-front" d="${front}" ${L} stroke="#0ea5e9" stroke-width="2"/>
      ${bubbles}
    </g>
    <path d="M${T.x} ${T.y} V${bottom - 12} Q${T.x} ${bottom} ${T.x + 12} ${bottom} H${T.x + T.w - 12} Q${T.x + T.w} ${bottom} ${T.x + T.w} ${bottom - 12} V${T.y}" ${L} stroke="#475569" stroke-width="2"/>
    <line x1="${T.x + 6}" y1="${level}" x2="${R + 14}" y2="${level}" stroke="#3b82f6" stroke-width="1" stroke-dasharray="3 3" opacity=".6"/>
    <g stroke="#cbd5e1">${ticks}<line x1="${R + 28}" y1="${yOf(0)}" x2="${R + 28}" y2="${yOf(100)}"/></g>
    <line x1="${R + 28}" y1="${bandTop}" x2="${R + 28}" y2="${bandBot}" stroke="#22c55e" stroke-width="4" stroke-linecap="round"/>
    <g class="tank-pointer"><path d="M${R + 11} ${level - 5} L${R + 18} ${level} L${R + 11} ${level + 5}" ${L} stroke="#2563eb" stroke-width="2"/></g>`;
}

// 補水量長條圖：跟著上方 24h／7d／30d 切換（24h 每小時、其餘每日）
function atoSeries() {
  const a = STATE.data.ato;
  if (STATE.range === '24h') return { unit: '每小時 · 近 24 小時', rows: a.hourly_24h.map(x => ({ label: `${pad2(new Date(x.t).getHours())}:00`, l: x.l, n: x.n })) };
  const days = STATE.range === '7d' ? a.daily_30d.slice(-7) : a.daily_30d;
  return { unit: `每日 · 近 ${days.length} 天`, rows: days.map(x => ({ label: x.d.slice(5).replace('-', '/'), l: x.l, n: x.n })) };
}
function buildAtoChart() {
  return new Chart(document.getElementById('chart-ato').getContext('2d'), {
    type: 'bar',
    data: { labels: [], datasets: [{ data: [], backgroundColor: '#7dd3fc', hoverBackgroundColor: '#0ea5e9', borderRadius: 2, maxBarThickness: 14 }] },
    options: {
      responsive: true, maintainAspectRatio: false, animation: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: '#ffffff', borderColor: '#e2e8f0', borderWidth: 1, titleColor: '#1e293b', bodyColor: '#475569', padding: 8, displayColors: false,
          callbacks: { label: c => ` ${c.parsed.y.toFixed(2)} 升 · ${STATE.atoRows[c.dataIndex].n} 次` },
        },
      },
      scales: {
        x: { ticks: { color: '#94a3b8', font: { size: 9 }, maxRotation: 0, autoSkipPadding: 8 }, grid: { display: false } },
        y: { beginAtZero: true, ticks: { color: '#94a3b8', font: { size: 9 }, maxTicksLimit: 4, callback: v => v + ' L' }, grid: { color: 'rgba(226,232,240,.6)' } },
      },
    },
  });
}
function refreshAtoChart() {
  if (!STATE.atoChart) return;
  const { unit, rows } = atoSeries();
  STATE.atoRows = rows;
  STATE.atoChart.data.labels = rows.map(r => r.label);
  STATE.atoChart.data.datasets[0].data = rows.map(r => r.l);
  STATE.atoChart.update('none');
  document.getElementById('ato-range-label').textContent = unit;
}

const nowLinePlugin = {
  id: 'nowLine',
  afterDatasetsDraw(chart) {
    const x = chart.scales.x.getPixelForValue(nowHour()), a = chart.chartArea, ctx = chart.ctx;
    ctx.save();
    ctx.strokeStyle = '#ef4444'; ctx.lineWidth = 1; ctx.setLineDash([4, 4]);
    ctx.beginPath(); ctx.moveTo(x, a.top); ctx.lineTo(x, a.bottom); ctx.stroke();
    ctx.setLineDash([]); ctx.fillStyle = '#ef4444'; ctx.font = '10px Inter, sans-serif';
    ctx.fillText('現在', Math.min(x + 4, a.right - 24), a.top + 10);
    ctx.restore();
  }
};

function buildLightChart(light) {
  return new Chart(document.getElementById('chart-light').getContext('2d'), {
    type: 'line',
    data: { datasets: light.channels.map(ch => ({
      label: ch.name,
      data: [...light.hours, 24].map((h, i) => ({ x: h, y: ch.values[i % ch.values.length] })),
      borderColor: ch.color, borderWidth: 2, cubicInterpolationMode: 'monotone',
      pointRadius: 3, pointBackgroundColor: '#ffffff', pointBorderColor: ch.color, pointBorderWidth: 1.5,
    })) },
    options: {
      responsive: true, maintainAspectRatio: false, animation: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: '#ffffff', borderColor: '#e2e8f0', borderWidth: 1,
          titleColor: '#1e293b', bodyColor: '#475569', padding: 8,
          callbacks: { title: items => `${pad2(items[0].parsed.x % 24)}:00`, label: c => ` ${c.dataset.label} ${c.parsed.y}%` },
        },
      },
      scales: {
        x: { type: 'linear', min: 0, max: 24, ticks: { stepSize: 2, color: '#94a3b8', font: { size: 10 } }, grid: { color: 'rgba(226,232,240,.6)' } },
        y: { min: 0, max: 100, ticks: { stepSize: 20, color: '#94a3b8', font: { size: 10 }, callback: v => v + '%' }, grid: { color: 'rgba(226,232,240,.6)' } },
      },
    },
    plugins: [nowLinePlugin],
  });
}

function updateLight() {
  const light = STATE.data.light, h = nowHour();
  const cur = light.channels.map(ch => ({ ch, v: Math.round(lightAt(light, ch, h)) }));
  document.getElementById('light-legend').innerHTML = cur.map(({ ch, v }) =>
    `<span class="flex items-center gap-1.5"><span style="display:inline-block;width:12px;height:3px;border-radius:2px;background:${ch.color}"></span>` +
    `${ch.name} 最高 ${Math.max(...ch.values)}% · 現在 <b class="text-fog-200">${v}%</b></span>`).join('');
  if (STATE.lightChart) STATE.lightChart.update('none');  // 重畫「現在」線
}

function tick() {
  const c = STATE.current;
  const next = {
    sst: clamp(c.sst + jitter(0.02), 18, 32),
    sg:  clamp(c.sg  + jitter(0.00004), 1.0235, 1.0265),
    n:   clamp(c.n   + jitter(0.1), 2, 15),
    p:   clamp(c.p   + jitter(0.005), 0.02, 0.3),
  };
  KEYS.forEach(k => setReading(k, next[k]));
  updateLight();

  const t = new Date();
  STATE.current.t = t.toISOString();

  if (STATE.range === '24h') {
    KEYS.forEach(k => {
      const ds = STATE.charts[k].data.datasets[0];
      ds.data.push({ x: t.getTime(), y: next[k] });
      if (ds.data.length > 200) ds.data.shift();
      if (k === 'sst') STATE.charts.sst.data.datasets[0].pointRadius = ds.data.map(p => p.y >= 28.5 ? 3 : 0);
    });
    Object.values(STATE.charts).forEach(c => c.update('none'));
  }
}
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

// =========================================
//  Boot
// =========================================
async function main() {
  const r = await fetch('environment_data.json');
  STATE.data = await r.json();

  const c = STATE.data.current;
  STATE.current = { sst: c.sst, sg: c.sg, n: c.n, p: c.p, t: c.t };
  STATE.prev    = { ...STATE.current };
  KEYS.forEach(k => setReading(k, c[k]));

  STATE.charts.sst = buildChart('chart-sst', 'sst', '#f87171', { min: 22, max: 25 });
  STATE.charts.sg  = buildChart('chart-sg',  'sg',  '#34d399', { min: 1.024, max: 1.026 });
  STATE.charts.n   = buildChart('chart-n',   'n',   '#60a5fa', { min: 4, max: 11 });
  STATE.charts.p   = buildChart('chart-p',   'p',   '#fbbf24', { min: 0.08, max: 0.22 });
  refreshCharts();

  document.querySelectorAll('.seg-btn').forEach(b => b.addEventListener('click', () => setRange(b.dataset.range)));

  // Modal
  const modal = document.getElementById('modal');
  document.getElementById('alert-settings').addEventListener('click', () => modal.classList.remove('hidden'));
  document.getElementById('modal-close').addEventListener('click',   () => modal.classList.add('hidden'));
  document.getElementById('modal-ok').addEventListener('click',      () => modal.classList.add('hidden'));
  modal.addEventListener('click', e => { if (e.target === modal) modal.classList.add('hidden'); });

  renderAto(STATE.data.ato);
  STATE.atoChart = buildAtoChart();
  refreshAtoChart();
  STATE.lightChart = buildLightChart(STATE.data.light);
  updateLight();

  setInterval(tick, 30000);
}
main().catch(e => { document.body.innerHTML = '<pre style="color:#fca5a5;padding:20px">'+e+'</pre>'; });
</script>
</body>
