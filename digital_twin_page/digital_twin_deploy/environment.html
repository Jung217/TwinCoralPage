<script>
// =========================================
//  Data loading + state
// =========================================
const STATE = {
  data: null,                  // parsed environment_data.json
  range: '30d',                // '24h' | '7d' | '30d'
  charts: {},                  // chart instances
  current: { sst:0, ph:0, sal:0, do:0, t:null },
  prev:    { sst:0, ph:0, sal:0, do:0 },
};

const FMT = {
  sst: v => v.toFixed(2),
  ph:  v => v.toFixed(2),
  sal: v => v.toFixed(2),
  do:  v => v.toFixed(2),
};
const UNITS = { sst: '°C', ph: '', sal: '‰', do: 'mg/L' };

// =========================================
//  Time-series slicing
// =========================================
function getSeries(range) {
  const d = STATE.data;
  if (range === '24h') return d.history_24h;
  if (range === '7d')  return d.history_30d.slice(-24*7 - 1); // 169 點
  return d.history_30d;
}

// =========================================
//  Chart factory
// =========================================
function pointBgFor(key, val) {
  // Highlight warning points (SST >= 28.5°C) so the threshold story is visible
  if (key === 'sst' && val >= 28.5) return '#f87171';
  return 'transparent';
}
function pointRadiusFor(key, val) {
  if (key === 'sst' && val >= 28.5) return 3;
  return 0;
}

function buildChart(canvasId, key, color, axis) {
  const ctx = document.getElementById(canvasId).getContext('2d');
  const isSst = key === 'sst';
  return new Chart(ctx, {
    type: 'line',
    data: { datasets: [{
      label: key.toUpperCase(),
      data: [],
      borderColor: color,
      borderWidth: 1.4,
      tension: 0.25,
      pointRadius: 0,
      pointHoverRadius: 4,
      pointBackgroundColor: ctx2 => {
        const i = ctx2.dataIndex; const p = ctx2.dataset.data[i];
        return p ? pointBgFor(key, p.y) : 'transparent';
      },
      // Static (non-hover) radius — make warning points visible without hovering
      pointRadiusCallback: undefined,
      fill: { target: 'origin', above: hexToRgba(color, 0.06) },
    }]},
    options: {
      responsive: true, maintainAspectRatio: false, animation: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: '#0b1220', borderColor: '#1e293b', borderWidth: 1,
          titleColor: '#e2e8f0', bodyColor: '#cbd5e1', padding: 8,
          displayColors: false,
          callbacks: {
            title: items => new Date(items[0].parsed.x).toLocaleString(),
            label: ctx2 => ` ${FMT[key](ctx2.parsed.y)} ${UNITS[key]}`.trimEnd(),
          }
        },
        // Bleaching warning line (annotation) — done via custom plugin below for SST only
      },
      scales: {
        x: { type: 'time',
             time: { displayFormats: { hour: 'MM/dd HH:mm', day: 'MM/dd', minute: 'HH:mm' } },
             ticks: { color: '#64748b', maxRotation: 0, autoSkipPadding: 18, font: { size: 10 } },
             grid:  { color: 'rgba(30,41,59,.6)', drawBorder: false } },
        y: { ticks: { color: '#64748b', font: { size: 10 } },
             grid: { color: 'rgba(30,41,59,.6)', drawBorder: false },
             suggestedMin: axis.min, suggestedMax: axis.max },
      },
    },
    plugins: isSst ? [bleachLinePlugin] : [],
  });
}

// Custom plugin: dashed red line at 29°C with label
const bleachLinePlugin = {
  id: 'bleachLine',
  afterDatasetsDraw(chart) {
    const yScale = chart.scales.y; const xScale = chart.scales.x;
    const y = yScale.getPixelForValue(29.0);
    if (!isFinite(y)) return;
    const ctx = chart.ctx;
    ctx.save();
    ctx.strokeStyle = '#f87171'; ctx.lineWidth = 1; ctx.setLineDash([4,4]);
    ctx.beginPath(); ctx.moveTo(xScale.left, y); ctx.lineTo(xScale.right, y); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = '#fca5a5'; ctx.font = '10px Inter, sans-serif';
    ctx.fillText('白化警戒 · 29 °C', xScale.left + 6, y - 4);
    ctx.restore();
  }
};

function hexToRgba(hex, a) {
  const h = hex.replace('#',''); const n = parseInt(h, 16);
  const r = (n>>16)&255, g=(n>>8)&255, b=n&255;
  return `rgba(${r},${g},${b},${a})`;
}

// =========================================
//  Render
// =========================================
function setReading(key, val) {
  const prev = STATE.prev[key];
  STATE.prev[key] = STATE.current[key];
  STATE.current[key] = val;
  document.getElementById('r-'+key).textContent = FMT[key](val);
  const d = document.getElementById('d-'+key);
  const delta = val - prev;
  if (Math.abs(delta) < 0.005) { d.className='trend-flat text-[12px] ml-auto tabular-nums'; d.textContent='→ ±0.00'; }
  else if (delta > 0) { d.className='trend-up text-[12px] ml-auto tabular-nums'; d.textContent='▲ +'+FMT[key](Math.abs(delta)); }
  else                { d.className='trend-down text-[12px] ml-auto tabular-nums'; d.textContent='▼ -'+FMT[key](Math.abs(delta)); }
}

function refreshCharts() {
  const s = getSeries(STATE.range);
  const make = key => s.map(p => ({ x: new Date(p.t).getTime(), y: p[key] }));
  STATE.charts.sst.data.datasets[0].data = make('sst');
  STATE.charts.ph .data.datasets[0].data = make('ph');
  STATE.charts.sal.data.datasets[0].data = make('sal');
  STATE.charts.do .data.datasets[0].data = make('do');
  // For sst, refresh point radii via callback (Chart.js doesn't accept fn for radius directly, do per-point)
  const sstData = STATE.charts.sst.data.datasets[0].data;
  STATE.charts.sst.data.datasets[0].pointRadius = sstData.map(p => p.y >= 28.5 ? 3 : 0);
  Object.values(STATE.charts).forEach(c => c.update('none'));
  const label = STATE.range === '24h' ? '近 24 小時' : STATE.range === '7d' ? '近 7 天' : '近 30 天';
  ['sst','ph','sal','do'].forEach(k => document.getElementById('range-label-'+k).textContent = label);
}

function setRange(r) {
  STATE.range = r;
  document.querySelectorAll('.seg-btn').forEach(b => b.classList.toggle('active', b.dataset.range === r));
  refreshCharts();
}

// =========================================
//  即時更新：每 30 秒 ±0.1
// =========================================
function jitter(amp) { return (Math.random()*2 - 1) * amp; }

function tick() {
  const c = STATE.current;
  // Walk ±0.1 within plausible bounds (don't drift away)
  const next = {
    sst: clamp(c.sst + jitter(0.1), 26, 30),
    ph:  clamp(c.ph  + jitter(0.02), 7.9, 8.3),
    sal: clamp(c.sal + jitter(0.05), 34, 36),
    do:  clamp(c.do  + jitter(0.1), 5, 8),
  };
  setReading('sst', next.sst);
  setReading('ph',  next.ph);
  setReading('sal', next.sal);
  setReading('do',  next.do);

  const t = new Date();
  STATE.current.t = t.toISOString();
  document.getElementById('last-update').textContent = t.toLocaleTimeString();

  // Push to charts' tail (only on 24h view — most natural place to see fresh point appear)
  if (STATE.range === '24h') {
    ['sst','ph','sal','do'].forEach(k => {
      const ds = STATE.charts[k].data.datasets[0];
      ds.data.push({ x: t.getTime(), y: next[k] });
      if (ds.data.length > 200) ds.data.shift();
      if (k === 'sst') STATE.charts.sst.data.datasets[0].pointRadius = ds.data.map(p => p.y >= 28.5 ? 3 : 0);
    });
    Object.values(STATE.charts).forEach(c => c.update('none'));
  }
}
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

// =========================================
//  Boot
// =========================================
async function main() {
  const r = await fetch('environment_data.json');
  STATE.data = await r.json();

  const c = STATE.data.current;
  STATE.current = { sst: c.sst, ph: c.ph, sal: c.sal, do: c.do, t: c.t };
  STATE.prev    = { ...STATE.current };
  setReading('sst', c.sst); setReading('ph', c.ph); setReading('sal', c.sal); setReading('do', c.do);
  document.getElementById('last-update').textContent = new Date(c.t).toLocaleTimeString();

  STATE.charts.sst = buildChart('chart-sst', 'sst', '#f87171', { min: 25, max: 30 });
  STATE.charts.ph  = buildChart('chart-ph',  'ph',  '#60a5fa', { min: 7.9, max: 8.3 });
  STATE.charts.sal = buildChart('chart-sal', 'sal', '#34d399', { min: 33.5, max: 36 });
  STATE.charts.do  = buildChart('chart-do',  'do',  '#fbbf24', { min: 5, max: 8 });
  refreshCharts();

  document.querySelectorAll('.seg-btn').forEach(b => b.addEventListener('click', () => setRange(b.dataset.range)));

  // Modal
  const modal = document.getElementById('modal');
  document.getElementById('alert-settings').addEventListener('click', () => modal.classList.remove('hidden'));
  document.getElementById('modal-close').addEventListener('click',   () => modal.classList.add('hidden'));
  document.getElementById('modal-ok').addEventListener('click',      () => modal.classList.add('hidden'));
  modal.addEventListener('click', e => { if (e.target === modal) modal.classList.add('hidden'); });

  // Live update every 30s
  setInterval(tick, 30000);
}
main().catch(e => { document.body.innerHTML = '<pre style="color:#fca5a5;padding:20px">'+e+'</pre>'; });
</script>
</body>
