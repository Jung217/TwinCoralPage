  header { position:sticky; top:0; z-index:30; display:flex; align-items:center; gap:14px;

            border-bottom:1px solid var(--ink-800); }
  .logo { width:36px; height:36px; border-radius:9px; display:flex; align-items:center;

  h1 { margin:0; font-size:15px; font-weight:600; letter-spacing:-.01em; }
  .sub { font-size:11px; color:var(--fog-400); }

            color:var(--fog-400); background:#fff; }
  /* 導覽連結：四頁共用。不預先高亮任何一項，僅 hover 有變化 */
  .nav-link { display:inline-flex; align-items:center; padding:6px 12px; border-radius:8px;
              font-size:12px; line-height:1.25; white-space:nowrap; text-decoration:none;
              color:#475569; background:#fff; border:1px solid #e2e8f0;
              transition:color .15s ease, border-color .15s ease, background-color .15s ease; }
  .nav-link:hover { color:#ea580c; border-color:rgba(249,115,22,.45); background:rgba(249,115,22,.08); }
  main { max-width:1440px; margin:0 auto; padding:18px 20px 60px; }
  section { margin-bottom:16px; }
  .card { background:#fff; border:1px solid var(--ink-800); border-radius:12px; box-shadow:var(--shadow-card); }
  .card-h { padding:11px 14px; border-bottom:1px solid var(--ink-800); display:flex;
             align-items:center; justify-content:space-between; }
  .card-h h2 { margin:0; font-size:12px; font-weight:600; letter-spacing:.02em; }
  .card-h .note { font-size:11px; color:var(--fog-400); }
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:10px; }
  .stat { background:#fff; border:1px solid var(--ink-800); border-radius:12px; padding:13px 15px;
           box-shadow:var(--shadow-card); }
  .stat .k { font-size:11px; color:var(--fog-400); margin-bottom:5px; }
  .stat .v { font-size:24px; font-weight:700; letter-spacing:-.02em; font-variant-numeric:tabular-nums; }
  .stat .u { font-size:11px; color:var(--fog-400); font-weight:500; margin-left:3px; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:7px;
          vertical-align:middle; }
  .toolbar { display:flex; flex-wrap:wrap; align-items:center; gap:8px; padding:11px 14px; }
  input[type=search], select { font:inherit; font-size:12px; padding:6px 10px; border-radius:8px;
    border:1px solid var(--ink-700); background:#fff; color:var(--fog-100); outline:none; }
  input[type=search] { min-width:190px; }
  input[type=search]:focus, select:focus { border-color:var(--coral-400);
    box-shadow:0 0 0 3px rgba(249,115,22,.12); }
  .chips { display:flex; flex-wrap:wrap; gap:6px; padding:0 14px 12px; }
  .chip { font:inherit; font-size:11px; display:inline-flex; align-items:center; gap:0;
           padding:4px 9px; border-radius:999px; border:1px solid var(--ink-700);
           background:#fff; color:var(--fog-300); cursor:pointer; transition:.12s; }
  .chip b { margin-left:6px; font-variant-numeric:tabular-nums; color:var(--fog-400); font-weight:600; }
  .chip:hover:not(:disabled) { border-color:var(--coral-400); color:var(--fog-100); }
  .chip.on { background:var(--fog-100); border-color:var(--fog-100); color:#fff; }
  .chip.on b { color:var(--ink-700); }
  .chip:disabled { opacity:.4; cursor:not-allowed; text-decoration:line-through; }

  /* 圖片直接鋪排：無圓角、緊貼、單列多張 */
  .gallery { display:grid; gap:2px; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); }
  .item { position:relative; margin:0; overflow:hidden; cursor:zoom-in;

  .item img { display:block; width:100%; aspect-ratio:16/9; object-fit:cover; }

  .item figcaption { position:absolute; left:0; right:0; bottom:0; display:flex; gap:8px;

  .item:hover figcaption { opacity:1; }
  .item figcaption .n { white-space:nowrap; color:var(--ink-700); }
  .empty { padding:44px; text-align:center; color:var(--fog-400); font-size:12px; }

  dialog { border:0; padding:0; background:transparent; max-width:96vw; max-height:96vh; }
  dialog::backdrop { background:rgba(15,23,42,.82); backdrop-filter:blur(3px); }
  .lb { background:#fff; border-radius:13px; overflow:hidden; box-shadow:0 20px 60px rgba(0,0,0,.4); }
  .lb img { display:block; max-width:92vw; max-height:78vh; object-fit:contain; background:#0f172a; }
  .lb .bar2 { display:flex; align-items:center; justify-content:space-between; gap:14px;

  .lb button:hover { border-color:var(--coral-400); color:var(--fog-100); }
  footer { text-align:center; font-size:11px; color:var(--fog-400); padding:22px 0 6px; }

<button class="chip" data-cls="10" ><span class="dot" style="background:#2C99A8"></span>Amphiprion ocellaris<b></b></button></div>
  </section>

  <footer>CIHCI Lab · 由 make_label_gallery.py 產生</footer>
</main>

const CLS = Object.fromEntries(DATA.classes.map(c => [c.id, c]));
const sel = new Set();
let view = [];

const $ = s => document.querySelector(s);
const gallery = $('#gallery');

function apply() {
  const q = $('#q').value.trim().toLowerCase();
  const mode = $('#mode').value;
  view = DATA.records.filter(r => {
    if (q && !r.id.toLowerCase().includes(q)) return false;
    if (!sel.size) return true;
    const has = c => (r.counts[c] || 0) > 0;
    return mode === 'and' ? [...sel].every(has) : [...sel].some(has);
  });
  const s = $('#sort').value;
  if (s === 'total-desc') view.sort((a, b) => b.total - a.total || a.id.localeCompare(b.id));
  else if (s === 'total-asc') view.sort((a, b) => a.total - b.total || a.id.localeCompare(b.id));
  else view.sort((a, b) => a.id.localeCompare(b.id));

  $('#count-note').textContent = sel.size ? `已選 ${sel.size} 類` : '未篩選';

  gallery.innerHTML = view.map((r, i) => `<figure class="item" data-i="${i}">
      <img loading="lazy" src="${r.thumb}" alt="${r.id}">
      <figcaption><span>${r.id}</span><span class="n">${r.total} 標記</span></figcaption>
    </figure>`).join('');
  $('#empty').hidden = view.length > 0;
}

document.querySelectorAll('.chip[data-cls]').forEach(btn => {
  btn.onclick = () => {
    const c = +btn.dataset.cls;
    sel.has(c) ? sel.delete(c) : sel.add(c);
    btn.classList.toggle('on', sel.has(c));
    apply();
  };
});
$('#clear').onclick = () => {
  sel.clear(); $('#q').value = '';
  document.querySelectorAll('.chip.on').forEach(b => b.classList.remove('on'));
  apply();
};
$('#q').oninput = apply; $('#sort').onchange = apply; $('#mode').onchange = apply;

let cur = 0;
function open_(i) {
  cur = (i + view.length) % view.length;
  const r = view[cur];
  $('#lb-img').src = r.full;
  $('#lb-id').textContent = `${r.id} · ${r.total} 個標記`;
  $('#lb-cls').innerHTML = Object.keys(r.counts).sort((a, b) => a - b)
    .map(c => `<span><i class="dot" style="background:${CLS[c].color};width:7px;height:7px;margin-right:5px"></i>${CLS[c].name} ×${r.counts[c]}</span>`).join('');
  if (!$('#lb').open) $('#lb').showModal();
}
gallery.onclick = e => { const it = e.target.closest('.item'); if (it) open_(+it.dataset.i); };
$('#prev').onclick = () => open_(cur - 1);
$('#next').onclick = () => open_(cur + 1);
$('#close').onclick = () => $('#lb').close();
addEventListener('keydown', e => {
  if (!$('#lb').open) return;
  if (e.key === 'ArrowLeft') open_(cur - 1);
  if (e.key === 'ArrowRight') open_(cur + 1);
});

apply();
</script>
